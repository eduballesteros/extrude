name: extrude
services:
  api:
    image: extrude-api:${EXTRUDE_RELEASE:?Define EXTRUDE_RELEASE}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      EXTRUDE_ORIGIN: https://${EXTRUDE_DOMAIN:?Define EXTRUDE_DOMAIN}
    secrets:
      - providers
    volumes:
      - projects:/data/jobs
      - accounts:/data/accounts
    read_only: true
    tmpfs:
      - '/tmp:size=536870912,uid=10001,gid=10001,mode=1770'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    cpus: 2
    mem_limit: 4g
    pids_limit: 128
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, /opt/extrude/runtime.py, health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  web:
    image: extrude-web:${EXTRUDE_RELEASE:?Define EXTRUDE_RELEASE}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      EXTRUDE_DOMAIN: ${EXTRUDE_DOMAIN:?Define EXTRUDE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Define ACME_EMAIL}
    ports:
      - '80:8080'
      - '443:8443'
    volumes:
      - certificates:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - '/tmp:size=16777216,uid=10001,gid=10001'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 256m
    pids_limit: 64
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
secrets:
  providers:
    file: ./private/providers.json
volumes:
  projects:
  accounts:
  certificates:
  caddy_config:
