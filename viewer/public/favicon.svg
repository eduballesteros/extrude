<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Sunlit roof gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Left wall gradient (ambient shadow) -->
    <linearGradient id="leftWallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <!-- Right wall gradient (sun-facing facade) -->
    <linearGradient id="rightWallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Extrusion arrow gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Sun radial gradient -->
    <radialGradient id="sunGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>

    <!-- Soft glow filter for sun and highlights -->
    <filter id="sunGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container badge with rounded corners -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- CAD Blueprint Grid lines -->
  <path d="M10 47 L34 59 L58 47" fill="none" stroke="#1e3a5f" stroke-width="0.8" stroke-dasharray="2,2" />
  <path d="M18 43 L34 51 L50 43" fill="none" stroke="#1e3a5f" stroke-width="0.8" stroke-dasharray="2,2" />
  <path d="M34 40 L34 59" fill="none" stroke="#1e3a5f" stroke-width="0.8" stroke-dasharray="2,2" />

  <!-- Ground 2D CAD Footprint -->
  <polygon points="18,43 34,51 50,43 34,35" fill="#0284c7" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.9" stroke-dasharray="2,1.5" />

  <!-- Extrusion Guide Lines -->
  <line x1="18" y1="43" x2="18" y2="25" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="1.5,1.5" stroke-opacity="0.5" />
  <line x1="50" y1="43" x2="50" y2="25" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="1.5,1.5" stroke-opacity="0.5" />

  <!-- 3D Extruded Building Block -->
  <!-- Left Wall (ambient shadow) -->
  <polygon points="18,25 34,33 34,51 18,43" fill="url(#leftWallGrad)" stroke="#0284c7" stroke-width="0.5" />
  <!-- Right Wall (sunlit facade) -->
  <polygon points="34,33 50,25 50,43 34,51" fill="url(#rightWallGrad)" stroke="#38bdf8" stroke-width="0.5" />

  <!-- Floor bands on walls -->
  <line x1="18" y1="31" x2="34" y2="39" stroke="#0284c7" stroke-width="0.75" />
  <line x1="34" y1="39" x2="50" y2="31" stroke="#7dd3fc" stroke-width="0.75" stroke-opacity="0.8" />
  <line x1="18" y1="37" x2="34" y2="45" stroke="#0284c7" stroke-width="0.75" />
  <line x1="34" y1="45" x2="50" y2="37" stroke="#7dd3fc" stroke-width="0.75" stroke-opacity="0.8" />

  <!-- Roof (sunlit top face) -->
  <polygon points="34,17 50,25 34,33 18,25" fill="url(#roofGrad)" stroke="#bae6fd" stroke-width="0.75" />

  <!-- Ridge highlight -->
  <line x1="34" y1="17" x2="34" y2="33" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.6" />

  <!-- Left Dimension & Extrusion Vector Arrow (+Z axis) -->
  <line x1="10" y1="43" x2="15" y2="43" stroke="#06b6d4" stroke-width="0.75" stroke-opacity="0.7" />
  <line x1="10" y1="25" x2="15" y2="25" stroke="#06b6d4" stroke-width="0.75" stroke-opacity="0.7" />
  <line x1="10" y1="43" x2="10" y2="17" stroke="url(#arrowGrad)" stroke-width="1.6" stroke-linecap="round" />
  <polygon points="10,13 7.5,18 12.5,18" fill="#38bdf8" />

  <!-- Sun in upper right -->
  <circle cx="52" cy="13" r="4.5" fill="url(#sunGrad)" filter="url(#sunGlow)" />
  <line x1="46" y1="17" x2="43" y2="19" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round" />
  <line x1="52" y1="6" x2="52" y2="4" stroke="#f59e0b" stroke-width="1" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="59" y1="13" x2="61" y2="13" stroke="#f59e0b" stroke-width="1" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- CAD snap vertices on ground -->
  <circle cx="18" cy="43" r="1.3" fill="#38bdf8" />
  <circle cx="34" cy="51" r="1.3" fill="#38bdf8" />
  <circle cx="50" cy="43" r="1.3" fill="#38bdf8" />
</svg>
