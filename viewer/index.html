<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Extrude Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1e1f22;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #app.dragging {
        outline: 4px dashed #4a7fa8;
        outline-offset: -4px;
      }
      .toolbar {
        position: fixed;
        top: 8px;
        left: 8px;
        display: flex;
        gap: 8px;
        align-items: center;
        color: #fff;
        background: rgb(0 0 0 / 55%);
        padding: 6px 10px;
        border-radius: 6px;
      }
      .info {
        position: fixed;
        right: 8px;
        bottom: 8px;
        max-width: 360px;
        max-height: 45vh;
        overflow: auto;
        color: #fff;
        background: rgb(0 0 0 / 70%);
        padding: 8px 12px;
        border-radius: 6px;
      }
      .info h3 {
        margin: 0 0 6px;
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .info dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 0;
      }
      .info dt {
        opacity: 0.7;
      }
      .info dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .stats {
        position: fixed;
        bottom: 8px;
        left: 8px;
        color: #fff;
        background: rgb(0 0 0 / 55%);
        padding: 4px 8px;
        border-radius: 4px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="toolbar">
      <label>Abrir GLB <input id="file" type="file" accept=".glb,.gltf" /></label>
      <span id="status">Arrastra un .glb o usa ?model=URL</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
