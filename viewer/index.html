<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extrude Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1e1f22;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #app.dragging {
        outline: 4px dashed #4a7fa8;
        outline-offset: -4px;
      }
      .toolbar {
        position: fixed;
        top: 8px;
        left: 8px;
        display: flex;
        gap: 8px;
        align-items: center;
        color: #fff;
        background: rgb(0 0 0 / 55%);
        padding: 6px 10px;
        border-radius: 6px;
      }
      .stats {
        position: fixed;
        bottom: 8px;
        left: 8px;
        color: #fff;
        background: rgb(0 0 0 / 55%);
        padding: 4px 8px;
        border-radius: 4px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="toolbar">
      <label>Abrir GLB <input id="file" type="file" accept=".glb,.gltf" /></label>
      <span id="status">Arrastra un .glb o usa ?model=URL</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
