<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Extrude Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1e1f22;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .camera-frame {
        position: absolute;
        pointer-events: none;
        outline: 1px solid rgb(255 255 255 / 80%);
        box-shadow: 0 0 0 100vmax rgb(0 0 0 / 30%);
      }
      .views-panel {
        position: fixed;
        top: 48px;
        left: 8px;
        width: 300px;
        max-height: calc(100vh - 100px);
        display: flex;
        flex-direction: column;
        gap: 6px;
        color: #eee;
        background: rgb(30 31 34 / 92%);
        border-radius: 6px;
        padding: 8px;
        box-sizing: border-box;
      }
      .views-panel.collapsed > :not(header) {
        display: none;
      }
      .views-panel header {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .views-panel h2 {
        margin: 0 auto 0 0;
        font-size: 14px;
      }
      .views-panel h3 {
        width: 100%;
        margin: 4px 0 0;
        font-size: 12px;
        opacity: 0.7;
      }
      .views-panel button {
        background: #3a3c42;
        color: #eee;
        border: 1px solid #4a4c52;
        border-radius: 4px;
        padding: 2px 6px;
        cursor: pointer;
      }
      .views-panel button:hover {
        background: #4a4c52;
      }
      .render-settings {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
      }
      .render-settings select {
        width: 100%;
      }
      .render-settings input[type='number'] {
        width: 64px;
      }
      .views-list {
        list-style: none;
        margin: 0;
        padding: 0;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .views-list li {
        display: flex;
        gap: 6px;
        padding: 4px;
        border-radius: 4px;
        background: #2a2b30;
      }
      .views-list li.active {
        outline: 1px solid #6fa8dc;
      }
      .views-list li.empty {
        opacity: 0.7;
        font-size: 12px;
      }
      .views-list img {
        width: 96px;
        height: 54px;
        object-fit: cover;
        background: #111;
        cursor: pointer;
        flex: none;
      }
      .views-list input {
        width: 100%;
        box-sizing: border-box;
        background: transparent;
        color: inherit;
        border: 1px solid transparent;
      }
      .views-list input:focus {
        border-color: #6fa8dc;
      }
      .views-list .actions {
        display: flex;
        gap: 2px;
        margin-top: 2px;
      }
      .views-panel footer {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      #app.dragging {
        outline: 4px dashed #4a7fa8;
        outline-offset: -4px;
      }
      .toolbar {
        position: fixed;
        top: 8px;
        left: 8px;
        display: flex;
        gap: 8px;
        align-items: center;
        color: #fff;
        background: rgb(0 0 0 / 55%);
        padding: 6px 10px;
        border-radius: 6px;
      }
      .info {
        position: fixed;
        right: 8px;
        bottom: 8px;
        max-width: 360px;
        max-height: 45vh;
        overflow: auto;
        color: #fff;
        background: rgb(0 0 0 / 70%);
        padding: 8px 12px;
        border-radius: 6px;
      }
      .info h3 {
        margin: 0 0 6px;
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .info dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 0;
      }
      .info dt {
        opacity: 0.7;
      }
      .info dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .toolbar a {
        color: #9cc8ff;
      }
      .conversion {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .conversion button {
        background: #3a3c42;
        color: #eee;
        border: 1px solid #4a4c52;
        border-radius: 4px;
      }
      .stats {
        position: fixed;
        bottom: 8px;
        left: 8px;
        color: #fff;
        background: rgb(0 0 0 / 55%);
        padding: 4px 8px;
        border-radius: 4px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="toolbar">
      <label title=".dwg/.dxf se convierten con extrude serve; .yaml fija la configuración">
        Abrir plano o modelo
        <input id="file" type="file" accept=".dwg,.dxf,.glb,.yaml,.yml" />
      </label>
      <span id="status">Arrastra un .dwg/.dxf (con extrude serve) o un .glb</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
