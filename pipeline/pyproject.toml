[project]
name = "extrude"
version = "1.0.1"
description = "Pipeline DWG/DXF → glTF 3D con metadatos por capa"
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.3",
    "shapely>=2.0",
    "numpy>=2.0",
    "mapbox-earcut>=1.0",
    "scipy>=1.13",
    "trimesh>=4.4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
extrude = "extrude.cli:app"

[project.optional-dependencies]
ai = [
    "anthropic>=2.8.0",
    "openai>=3.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "anthropic>=2.8.0",
    "openai>=3.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extrude"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PTH", "S"]
ignore = ["S603"]  # subprocess sin shell: las rutas se sanean antes (ver converters/)
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]  # assert y aleatorios no criptográficos en fixtures

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["extrude"]

[[tool.mypy.overrides]]
module = ["shapely.*", "mapbox_earcut.*", "scipy.*", "trimesh.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
